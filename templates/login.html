{% extends "base.html" %}
{% block title %}Sign in — NetPulse{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-pulse mt-4">
            <span class="tag">Sign in</span>
            <h4 class="mt-2 mb-3">Welcome to NetPulse</h4>

            {% if success_msg %}
            <div class="alert alert-success py-2 border-0 shadow-sm text-success font-outfit small mb-3" style="background-color: #ecfdf5; color: #065f46;">
                ✓ {{ success_msg }}
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username or Email Address</label>
                    <input type="text" name="username_or_email" class="form-control" placeholder="Enter your username or email" value="{{ form_input if form_input else '' }}" required autofocus>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label mb-0">Password</label>
                        <a href="{{ url_for('forgot_password') }}" class="small text-decoration-none text-primary fw-semibold">Forgot Password?</a>
                    </div>
                    <input type="password" name="password" class="form-control mt-1" required>
                </div>
                <button type="submit" class="btn btn-signal w-100 py-2 fs-6">Sign in</button>
            </form>

            <div class="d-flex justify-content-between align-items-center text-center small text-muted mt-3 pt-2 border-top">
                <span>New to NetPulse?</span>
                <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Create an account &rarr;</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
